version: '3.8'

services:
  ai-restoration:
    build: .
    image: ai-ultrahd-restoration:latest
    container_name: ai_restoration_hub
    restart: unless-stopped
    ports:
      - "127.0.0.1:7860:7860"
    volumes:
      - ./weights:/workspace/weights
      - ./outputs:/workspace/web_out
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      PYTHONUNBUFFERED: "1"
      GRADIO_SERVER_NAME: "0.0.0.0"
      GRADIO_USER: "${GRADIO_USER:?GRADIO_USER tanımlanmalıdır}"
      GRADIO_PASSWORD: "${GRADIO_PASSWORD:?GRADIO_PASSWORD tanımlanmalıdır}"
